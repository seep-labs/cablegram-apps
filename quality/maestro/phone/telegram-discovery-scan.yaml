# Spec 008 (US1, US2). Preconditions: authenticated main UI, a linked and healthy Telegram test account
# with at least one channel holding videos, and no saved choice. Asserts that the "On this phone" prompt
# comes before every scan, that nothing is ticked after a scan, and that a choice survives an app restart.
# Leaves nothing behind: the last steps untick the chat again.
appId: app.cablegram.phone
tags:
  - telegram
---
- launchApp
- tapOn:
    id: nav_browse
- scrollUntilVisible:
    element:
      id: telegram_add_from_chats
    direction: DOWN
    timeout: 20000

# The prompt comes first. Declining reads nothing and closes the screen.
- tapOn:
    id: telegram_add_from_chats
- assertVisible:
    id: discovery_prompt
- assertNotVisible:
    id: discovery_progress
- assertNotVisible:
    id: discovery_chat_check
- tapOn:
    id: discovery_not_now
- assertNotVisible:
    id: discovery_prompt

# And again on the next entry: no "don't ask again".
- scrollUntilVisible:
    element:
      id: telegram_add_from_chats
    direction: DOWN
    timeout: 20000
- tapOn:
    id: telegram_add_from_chats
- assertVisible:
    id: discovery_prompt
- tapOn:
    id: discovery_look
- assertVisible:
    id: discovery_progress
- extendedWaitUntil:
    visible:
      id: discovery_use
    timeout: 180000

# After the scan every box is unticked.
- assertVisible:
    id: discovery_chat_check
- assertNotVisible:
    id: discovery_chat_check
    checked: true

# Tick one chat, save, and restart the app.
- tapOn:
    id: discovery_chat_check
    index: 0
- assertVisible:
    id: discovery_chat_check
    checked: true
- tapOn:
    id: discovery_use
- stopApp
- launchApp
- tapOn:
    id: nav_browse
- scrollUntilVisible:
    element:
      id: telegram_add_from_chats
    direction: DOWN
    timeout: 20000

# The prompt is still first; Manage chats reopens the saved choice without scanning.
- tapOn:
    id: telegram_add_from_chats
- assertVisible:
    id: discovery_prompt
- assertVisible:
    id: discovery_manage
- tapOn:
    id: discovery_manage
- assertNotVisible:
    id: discovery_prompt
- assertNotVisible:
    id: discovery_progress
- assertVisible:
    id: discovery_chat_check
    checked: true

# Clean up: untick and save an empty choice.
- tapOn:
    id: discovery_chat_check
    checked: true
- tapOn:
    id: discovery_use
