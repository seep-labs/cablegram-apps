# Spec 008 (US5, FR-005, FR-008). Preconditions: authenticated main UI, a linked Telegram test account that has a
# one-to-one chat named "Masoud" holding videos, both Advanced switches off, and no saved chat choice.
# Turns personal chats on, picks that chat, then turns the switch off and checks the chat left the choice.
appId: app.cablegram.phone
tags:
  - telegram
---
- launchApp
- tapOn:
    id: nav_browse
- scrollUntilVisible:
    element:
      id: discovery_advanced
    direction: DOWN
    timeout: 20000
- tapOn:
    id: discovery_advanced

# Off by default; turning on shows a confirmation that repeats the notice, and starts no scan.
- tapOn:
    id: advanced_personal
- assertVisible:
    id: advanced_confirm
- assertVisible: ".*This happens on your phone.*|.*signed in to Telegram on this phone.*"
- tapOn:
    id: advanced_confirm

# The next scan lists personal chats, unticked.
- tapOn:
    id: telegram_add_from_chats
- assertVisible:
    id: discovery_prompt
- tapOn:
    id: discovery_look
- extendedWaitUntil:
    visible:
      id: discovery_use
    timeout: 180000
- assertVisible: ".*Personal chat.*"
- assertNotVisible:
    id: discovery_chat_check
    checked: true

# Pick it: the picker banner says personal chats are included.
- tapOn: "Masoud"
- tapOn:
    id: discovery_use
- extendedWaitUntil:
    visible:
      id: picker_banner
    timeout: 30000
- assertVisible: ".*including personal chats.*"
- tapOn:
    id: picker_done

# Turning the switch off removes the chat from the choice at once.
- tapOn:
    id: advanced_personal
- tapOn:
    id: telegram_add_from_chats
- assertVisible:
    id: discovery_prompt
- assertNotVisible:
    id: discovery_manage
- tapOn:
    id: discovery_not_now
