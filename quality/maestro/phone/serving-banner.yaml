# Preconditions: authenticated main UI on the iPhone app, with a paired TV playing a film from this iPhone (the banner shows
# only then, not for a paired TV alone). iOS only (Android shows a notification).
# Checks the "Serving to <TV>" banner, then stops serving. Serving starts again the next time the app is opened.
appId: app.cablegram.phone
---
- assertVisible:
    id: serving_banner
- tapOn:
    id: serving_stop
- assertNotVisible:
    id: serving_banner
